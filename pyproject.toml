[project]
name = "continuo-contracts"
version = "0.1.0"
description = "Canonical JSON, the Python code projection, the content_hash folds and the fingerprint field declaration that continuo and its producers share."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Simone Carolini" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["jsonschema>=4.26", "PyYAML>=6.0"]

[project.scripts]
continuo-contracts = "continuo_contracts.cli:main"

[project.urls]
Repository = "https://github.com/carolsimone/continuo-contracts"
Changelog = "https://github.com/carolsimone/continuo-contracts/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "import-linter==2.15",
    "types-PyYAML==6.0.12.20260906",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_contracts"]

[tool.ruff]
target-version = "py314"
line-length = 82

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]
