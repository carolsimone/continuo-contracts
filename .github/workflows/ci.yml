name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      # Overrides .python-version, so each leg runs its own interpreter.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Interpreter is ${{ matrix.python }}
        run: uv run --locked python -c "import sys; assert sys.version.startswith('${{ matrix.python }}.'), sys.version"
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy continuo_contracts scripts
      - run: uv run --locked pytest

  # The one check a ruleset requires, with dco. always() makes a failed test job fail
  # this job instead of skipping it, because a skipped check reads as passing.
  ci:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
